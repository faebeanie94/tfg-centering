# fly.toml app configuration file generated for tfg-centering on 2026-09-18T19:42:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "tfg-centering"
primary_region = 'lhr'

[build]
  dockerfile = "Dockerfile"

[env]
  # Production environment variables
  NODE_ENV = "production"
  PORT = "3001"
  SUPABASE_URL = "https://bmorzawcorhufrmfbyen.supabase.co"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  idle_timeout_seconds = 7200
  checks = [{ grace_period = '30s', interval = '15s', method = 'get', path = '/health', protocol = 'http', timeout = '5s' }]

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '2gb'
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
