# fly.toml app configuration file generated for tfg-centering on 2026-10-28T12:53:16Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "tfg-centering"
primary_region = 'lhr'

[build]
  dockerfile = "Dockerfile"

[env]
  # Production environment variables
  NODE_ENV = "production"
  PORT = "3001"
  SUPABASE_URL = "https://bmorzawcorhufrmfbyen.supabase.co"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  auto_stop_machines = 'suspend'
  min_machines_running = 1
  idle_timeout_seconds = 7200
  checks = [{ grace_period = '30s', interval = '15s', method = 'get', path = '/health', protocol = 'http', timeout = '10s' }]

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-1x'
