# fly.toml app configuration file generated for tfg-centering on 2026-09-08T12:00:00Z
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "tfg-centering"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Production environment variables
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"
