name: Fly Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: fly-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_APP: tfg-centering-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create preview app if needed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is empty. Add a Fly org/personal access token (not an app deploy token)."
            exit 1
          fi
          if flyctl status --app "$PREVIEW_APP" >/dev/null 2>&1; then
            echo "Preview app $PREVIEW_APP already exists"
            exit 0
          fi
          if ! flyctl apps create "$PREVIEW_APP" --org personal --yes; then
            echo "::error::Could not create $PREVIEW_APP. Use a Fly personal access token with org write access from https://fly.io/dashboard/personal/tokens"
            exit 1
          fi

      - name: Deploy preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "$PREVIEW_APP" \
            --ha=false \
            --remote-only \
            --yes

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${process.env.PREVIEW_APP}.fly.dev`;
            const marker = '<!-- fly-preview-url -->';
            const body = `${marker}\n**Preview:** ${url}\n\nAuto-deployed from this PR. The preview app is destroyed when the PR is closed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_APP: ${{ env.PREVIEW_APP }}

  destroy:
    name: Destroy preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps destroy "$PREVIEW_APP" --yes || true
